[pytest]
testpaths = tests
pythonpath = .

# Docker tests build images and run a full replay, so they are opt-in:
#   pytest              -> fast suite only
#   pytest -m docker    -> the docker-compose integration test
#   pytest -m ""        -> everything
addopts = -q -m "not docker"

markers =
    docker: integration test that runs the real docker-compose stack (slow)

filterwarnings =
    error::DeprecationWarning:services.*
