[project]
name = "pqcwire"
version = "0.1.0"
description = "Protocol framing, canonical AAD, and telemetry schema shared by every node"
# Deliberately py3.9: this package is imported by the frozen-firmware legacy
# device. It must stay stdlib-only so the device never pulls in PQC code.
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqcwire"]
