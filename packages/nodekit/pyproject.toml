[project]
name = "nodekit"
version = "0.1.0"
description = "Structured logging, environment configuration, and session storage shared by every node"
# py3.9 and stdlib-only so the frozen-firmware device can use it too.
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodekit"]
