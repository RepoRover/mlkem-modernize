[project]
name = "mlkem-modernize"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = []

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["device/src"]

[tool.pytest.ini_options]
pythonpath = ["device/src"]

[tool.uv.workspace]
members = [
    "device",
    "cloud",
    "gateway",
]

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "pytest>=9.0.2",
]

