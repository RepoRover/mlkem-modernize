[project]
name = "mlkem-modernize"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = []

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["device/src", "gateway/src", "cloud/src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "device",
    "cloud",
    "gateway",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "prek>=0.5.3",
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "ruff>=0.16.8",
]

