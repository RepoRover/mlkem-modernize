# Modernized deployment: the cloud-facing link is post-quantum.
#
#   legacy-device --> tap-edge --> gateway --> tap-backbone --> cloud
#     LEGACY-RSA2048-OAEP-AESGCM  |  MLKEM768-X25519-HKDF-AESGCM
#
# The device is unchanged and still speaks the only suite it has. The gateway
# terminates that session and opens a separate post-quantum one to the cloud,
# which is the whole point of brokering: the fleet migrates without the fielded
# hardware being touched.
#
# The cloud additionally refuses the legacy suite outright, modelling the end
# state of a migration where no quantum-vulnerable traffic is accepted.
#
# Run the same attack against this stack and compare with the baseline:
#   docker compose -f deploy/docker-compose.yml --profile attack \
#       run --rm harvester

name: mlkem-modern

x-node: &node
  build:
    context: ..
    dockerfile: deploy/Dockerfile.service
  environment: &node-env
    LOG_LEVEL: INFO

x-healthcheck-python: &healthcheck-python
  interval: 3s
  timeout: 3s
  retries: 10
  start_period: 3s

services:
  # Bootstrap trust locally, before either network endpoint starts. The cloud
  # private seed and gateway public-key pin live in separate volumes; both are
  # mounted read-only into the long-running services below.
  identity-provisioner:
    <<: *node
    command: ["python", "-m", "services.identity_provisioner"]
    environment:
      CLOUD_IDENTITY_PATH: /run/identity-private/cloud_mldsa.key
      CLOUD_IDENTITY_PUBLIC_KEY_PATH: /run/identity-public/cloud_mldsa.pub
    volumes:
      - cloud-identity-private:/run/identity-private
      - cloud-identity-public:/run/identity-public
    network_mode: none

  cloud:
    <<: *node
    command: ["python", "-m", "services.cloud"]
    environment:
      <<: *node-env
      PORT: "8000"
      CLOUD_DB_PATH: /var/lib/node/readings.db
      CLOUD_KEY_PATH: /var/lib/node/cloud_rsa.pem
      CLOUD_IDENTITY_PATH: /run/identity-private/cloud_mldsa.key
      # Migration complete: quantum-vulnerable traffic is no longer accepted.
      ALLOW_LEGACY_SUITE: "false"
    volumes:
      - cloud-state:/var/lib/node
      - cloud-identity-private:/run/identity-private:ro
    networks: [backbone]
    ports: ["8000:8000"]
    depends_on:
      identity-provisioner: {condition: service_completed_successfully}
    healthcheck:
      <<: *healthcheck-python
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]

  tap-backbone:
    <<: *node
    command: ["python", "-m", "services.tap"]
    environment:
      <<: *node-env
      PORT: "9000"
      LINK_LABEL: backbone
      TAP_UPSTREAM_URL: http://cloud:8000
      CAPTURE_PATH: /var/lib/capture/backbone.jsonl
    volumes:
      - capture:/var/lib/capture
    networks: [backbone]
    depends_on:
      cloud: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-python
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/tap/healthz')"]

  gateway:
    <<: *node
    command: ["python", "-m", "services.gateway"]
    environment:
      <<: *node-env
      PORT: "8080"
      # Upstream traffic is routed through the tap, so the gateway-to-cloud
      # link is observed exactly as the device-to-gateway link is.
      CLOUD_URL: http://tap-backbone:9000
      GATEWAY_KEY_PATH: /var/lib/node/gateway_rsa.pem
      UPSTREAM_SUITE: hybrid
      CLOUD_IDENTITY_PUBLIC_KEY_PATH: /run/identity-public/cloud_mldsa.pub
    volumes:
      - gateway-state:/var/lib/node
      - cloud-identity-public:/run/identity-public:ro
    # The gateway straddles both segments. That position is what lets it
    # terminate the device's legacy session and open a separate session onward.
    networks: [edge, backbone]
    ports: ["8080:8080"]
    depends_on:
      tap-backbone: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-python
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]

  tap-edge:
    <<: *node
    command: ["python", "-m", "services.tap"]
    environment:
      <<: *node-env
      PORT: "9000"
      LINK_LABEL: edge
      TAP_UPSTREAM_URL: http://gateway:8080
      CAPTURE_PATH: /var/lib/capture/edge.jsonl
    volumes:
      - capture:/var/lib/capture
    networks: [edge]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-python
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/tap/healthz')"]

  legacy-device:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.device
    environment:
      LOG_LEVEL: INFO
      GATEWAY_URL: http://tap-edge:9000
      DEVICE_ID: weather-station-01
      DATASET_PATH: /data/weather_data.csv
      SEND_INTERVAL_SECONDS: "0.2"
      MAX_READINGS: "0"
      # Replay the year continuously. Without this the device stops after 366
      # readings and every dashboard rate decays to zero, which looks like the
      # migration working when it only means the data ran out.
      LOOP_FOREVER: "true"
    volumes:
      - ../data:/data:ro
    networks: [edge]
    depends_on:
      tap-edge: {condition: service_healthy}

    # Hardware limits. These make the device's constraints a property of the
    # deployment rather than a claim in a comment. Note that neither the memory
    # nor the CPU cap is what prevents ML-KEM -- see Dockerfile.device.
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.1
    pids_limit: 32
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Offline attacker. Not started with the stack; run it on demand once enough
  # traffic has been captured.
  harvester:
    <<: *node
    profiles: ["attack"]
    entrypoint:
      - python
      - -m
      - services.harvester
      - --capture=/var/lib/capture/edge.jsonl
      - --capture=/var/lib/capture/backbone.jsonl
      - --rsa-key=/keys/gateway/gateway_rsa.pem
      - --rsa-key=/keys/cloud/cloud_rsa.pem
    command: []
    volumes:
      - capture:/var/lib/capture:ro
      # The attacker is handed both long-term private keys, modelling the end
      # state of a successful Shor's-algorithm recovery.
      - gateway-state:/keys/gateway:ro
      - cloud-state:/keys/cloud:ro
    networks: [backbone]

networks:
  # internal: true removes the default route, so the device can reach the edge
  # tap and nothing else. No package index, no upgrade path -- the constraint
  # that actually keeps fielded firmware on obsolete cryptography.
  edge:
    internal: true
  backbone:

volumes:
  cloud-state:
  cloud-identity-private:
  cloud-identity-public:
  gateway-state:
  capture:
