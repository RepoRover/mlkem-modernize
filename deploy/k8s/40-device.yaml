# The simulated legacy device. A Deployment rather than a Job because it
# replays continuously; the real thing is a field sensor that never stops.
#
# It has no Service and no probes: nothing calls it, it only calls out. A
# readiness probe would need an endpoint the real firmware does not have.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device
  namespace: weather
  labels: { app: device }
spec:
  replicas: 1
  selector:
    matchLabels: { app: device }
  template:
    metadata:
      labels: { app: device }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: device
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: "device"
            - name: DEVICE_ID
              value: "device-berlin-01"
            - name: GATEWAY_URL
              value: "http://gateway:8000"
            - name: DATA_FILE
              value: "/app/data/weather_data.csv"
          envFrom:
            - configMapRef: { name: wx-config }
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "25m", memory: "96Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: keys
          secret:
            secretName: wx-keys
            defaultMode: 0440  # root:fsGroup read; the app runs as gid 1000
