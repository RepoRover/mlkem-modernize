apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: weather
  labels: { app: gateway }
spec:
  replicas: 1   # sessions are in-memory and per-replica (W14)
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: "gateway"
            - name: PORT
              value: "8000"
            - name: GATEWAY_ID
              value: "gw-01"
            - name: CLOUD_URL
              value: "http://cloud:8000"   # resolved by the cloud Service
            - name: PQC_POLICY
              valueFrom:
                configMapKeyRef: { name: wx-config, key: GATEWAY_PQC_POLICY }
          envFrom:
            - configMapRef: { name: wx-config }
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: keys
          secret:
            secretName: wx-keys
            defaultMode: 0440  # root:fsGroup read; the app runs as gid 1000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: weather
spec:
  # ClusterIP only: the ingest endpoint is never exposed outside the cluster.
  # Only the cloud read API is reachable from outside, via port-forward in the
  # test environment.
  selector: { app: gateway }
  ports:
    - port: 8000
      targetPort: http
      name: http
