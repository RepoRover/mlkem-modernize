[project]
name = "cloud"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=47.0.0",
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "tzdata>=2025.2",
    "uvicorn>=0.40.0",
]

[project.scripts]
mlkem-cloud = "cloud.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
