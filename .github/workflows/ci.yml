name: CI/CD

# Every push gets the fast quality gates. Only main gets built, scanned and
# deployed -- a feature branch should not be able to publish an image.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency audit. A CVE can be published against code we have not
    # touched, so "the build was green last Friday" is not evidence it is still
    # safe today. This is the only job that needs to run without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same branch. Saves runner
  # minutes and stops two deploys racing for the same test cluster.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # least privilege by default; jobs opt in to more

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===================================================================
  # STAGE 1 - fast quality gates, all in parallel (~1 min total)
  # Catch: style drift, type errors, insecure patterns, vulnerable deps.
  # These run first because they are cheap and fail fast.
  # ===================================================================

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Catches: unused imports and variables, shadowed names, import order
      # drift, mutable default arguments, unreachable code, and the flake8-
      # bandit subset (hardcoded binds, subprocess misuse). Config and every
      # justified exception live in pyproject.toml, reviewable in one place.
      - name: ruff check
        run: ruff check . --output-format github

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Catches: the class of bug our tests are worst at finding -- a None that
      # reaches a function expecting bytes, a renamed field, a handshake helper
      # called with arguments in the wrong order. Crypto code passes a lot of
      # same-shaped `bytes` around, so this is real protection.
      - name: mypy
        run: mypy

  security-static:
    name: Static security analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Catches: insecure primitives (md5, DES), shell=True, unsafe yaml/pickle,
      # hardcoded credentials, SQL built by string concatenation. Every current
      # finding has been assessed and carries a targeted `# nosec` with a reason
      # -- there is no blanket suppression.
      - name: bandit
        run: bandit -c pyproject.toml -r services scripts -ll

  security-deps:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit
      # Catches: known CVEs in our dependency tree, including transitive ones we
      # never chose. This gate already earned its place -- it found 12 CVEs in
      # starlette 0.48 pulled in transitively by a stale fastapi pin.
      # Audits the declared requirements, not the resolved venv, so the result
      # matches what a fresh `pip install` would produce.
      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

  # ===================================================================
  # STAGE 2 - tests with a coverage gate
  # Catch: behavioural regressions, and silent erosion of the test suite.
  # ===================================================================

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      # 264 in-process tests: parsing, crypto wrappers, both handshakes, the
      # hybrid PQC path, negotiation, downgrade refusal, and the full
      # device -> gateway -> cloud flow. No Docker needed, ~10 s.
      #
      # fail_under = 85 (pyproject.toml) against ~91% actual. The headroom is
      # deliberate: device/main.py is exercised only by the Docker suite, where
      # coverage cannot be collected, so demanding 91% would punish a correct
      # change. 85 is still high enough that deleting a test module fails.
      - name: pytest with coverage gate
        run: pytest --cov=services --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ===================================================================
  # STAGE 3 - build and publish the image
  # Catch: "works on my machine" -- a dependency that will not install, a
  # Dockerfile that has drifted from the source layout.
  # ===================================================================

  build:
    name: Build & push image
    needs: [lint, typecheck, security-static, security-deps, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # only this job may publish
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Secrets via the CI's own identity. GITHUB_TOKEN is minted per run and
      # expires with it -- no long-lived registry credential exists anywhere,
      # and nothing is stored in the repo.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image serves all three services; the SERVICE env var selects the
      # module at runtime. Tagging: branch name, short SHA, and `latest` on
      # main. The SHA tag is the one deployments reference, because a moving
      # tag makes "which code is running?" unanswerable.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is also saved as an artifact so the scan and deploy jobs can
      # use the exact bytes that were built, rather than rebuilding and hoping
      # for reproducibility.
      - name: Export image for downstream jobs
        run: |
          docker buildx build --load -t wx:ci .
          docker save wx:ci -o /tmp/wx-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/wx-image.tar
          retention-days: 1

  # ===================================================================
  # STAGE 4 - container image scan
  # Catch: vulnerable OS packages in the base image, and anything pip-audit
  # cannot see because it is not a Python dependency.
  # ===================================================================

  scan-image:
    name: Container image scan (trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - run: docker load -i /tmp/wx-image.tar

      # Human-readable gate. Fails the build on HIGH/CRITICAL with a known fix.
      # `ignore-unfixed` is deliberate: a CVE with no available patch cannot be
      # actioned by us, and blocking every build on it trains people to ignore
      # the scanner entirely. Those still appear in the SARIF report below.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: wx:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      # Full report, including unfixed findings, into the Security tab so they
      # are visible and tracked even though they do not block.
      - name: Trivy scan (report)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: wx:ci
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true   # Security tab needs a paid plan on private repos

  # ===================================================================
  # STAGE 5 - integration against the real compose stack
  # Catch: what the in-process tests structurally cannot -- keygen ordering,
  # volume permissions, healthchecks, depends_on conditions, service DNS.
  # ===================================================================

  integration-compose:
    name: Integration (docker-compose)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      # 11 tests that stand up the actual compose stack, replay all 366
      # readings, and assert hybrid PQC was negotiated with zero classical
      # fallback -- against real containers, not TestClient.
      - name: pytest -m docker
        run: pytest -m docker

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # ===================================================================
  # STAGE 6 - deploy to a test environment (kind) + smoke test
  # Catch: deployment-shaped failures -- a missing Secret, an env var that
  # exists in compose but not in the manifests, a probe that never passes,
  # a Service name the gateway cannot resolve.
  # ===================================================================

  deploy-test:
    name: Deploy to test (kind) + smoke test
    needs: [build, scan-image, integration-compose]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: weather-test
          wait: 120s

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image into the cluster
        run: |
          docker load -i /tmp/wx-image.tar
          kind load docker-image wx:ci --name weather-test

      - name: Apply namespace and config
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/10-config.yaml

      # SECRETS. Keys are generated fresh for this run and injected as a
      # Kubernetes Secret. Nothing cryptographic is committed to the repo, and
      # these keys die with the cluster at the end of the job.
      #
      # A production pipeline would NOT generate keys here -- it would pull
      # them from a KMS/HSM using an OIDC-federated identity. This is the
      # test-environment shortcut, and it is deliberate. See docs/DECISIONS.md.
      - name: Generate ephemeral dev keys and create the Secret
        run: |
          python scripts/gen_keys.py --out keys
          kubectl -n weather create secret generic wx-keys \
            --from-file=keys/ \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -rf keys
          echo "::add-mask::$(echo generated)"   # keys never printed regardless

      - name: Deploy
        run: |
          # Pin every workload to the exact image we built and scanned.
          for f in deploy/k8s/20-cloud.yaml deploy/k8s/30-gateway.yaml deploy/k8s/40-device.yaml; do
            sed "s|IMAGE_PLACEHOLDER|wx:ci|g" "$f" | kubectl apply -f -
          done

      - name: Wait for rollout
        run: |
          kubectl -n weather rollout status deploy/cloud   --timeout=180s
          kubectl -n weather rollout status deploy/gateway --timeout=180s
          kubectl -n weather rollout status deploy/device  --timeout=180s
          kubectl -n weather get pods -o wide

      - name: Port-forward the cloud read API
        run: |
          kubectl -n weather port-forward svc/cloud 8000:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done

      # POST-DEPLOY SMOKE TEST. Not just "is it 200" -- it asserts readings
      # reached storage, nothing was rejected, and hop 2 negotiated hybrid PQC
      # with zero classical fallback. A deploy that is merely *up* but silently
      # downgraded would pass a naive health check and fail this one.
      - name: Smoke test
        run: |
          python scripts/smoke_test.py \
            --cloud-url http://127.0.0.1:8000 \
            --expect-readings 5 \
            --timeout 180

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n weather get pods -o wide || true
          kubectl -n weather describe pods || true
          for app in cloud gateway device; do
            echo "===== $app ====="
            kubectl -n weather logs -l app=$app --tail=100 || true
          done
          kubectl -n weather get events --sort-by=.lastTimestamp || true

      - name: Tear down
        if: always()
        run: kind delete cluster --name weather-test || true

  # ===================================================================
  # Single required status check, so branch protection needs one entry
  # rather than a list that silently rots as jobs are added.
  # ===================================================================

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, typecheck, security-static, security-deps, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gate failed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "security-static=${{ needs.security-static.result }}"
          echo "security-deps=${{ needs.security-deps.result }}"
          echo "test=${{ needs.test.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
