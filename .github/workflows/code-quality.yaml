name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup

      - name: Install workspace dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync pyright .

      - name: Run unit tests
        run: uv run --no-sync pytest -q

      - name: Validate Compose configuration
        run: docker compose --profile tools config --format json | uv run --no-sync python tools/check_deployment.py

      - name: Validate observability overlay
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config --format json | uv run --no-sync python tools/check_observability.py

  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: device
            dockerfile: device/Dockerfile
          - image: gateway
            dockerfile: gateway/Dockerfile
          - image: cloud
            dockerfile: cloud/Dockerfile
          - image: tools
            dockerfile: tools/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "mlkem-modernize-${{ matrix.image }}:ci" .
